server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Vite fingerprints these, so they can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # A single-page app: unknown paths are routes, not missing files.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /api/stream/ is server-sent events: buffering or a compressing filter
        # would hold readings back until the buffer filled, and the default read
        # timeout would drop an idle stream after a minute.
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1d;
    }
}
