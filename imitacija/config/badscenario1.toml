# Compressed synthetic SANS demonstration, not clinical disease kinetics.
seed = 42
speed = 1
#duration_s = 4200
# No enabled_channels: every channel reports from boot, with the SANS fault on top.
base_url = "http://127.0.0.1:8000"
data_route = "/api/readings/"
# Dose rate, gravity and comm delay follow the dashboard's environment.
follow_backend_environment = true

[environment]
gravity_g = 0

[[crew]]
id = "crew-1"
resting_hr_bpm = 72
sbp_mmhg = 118
dbp_mmhg = 78
rmssd_ms = 48

[sans_scenario]
id = "FAULT_01_SANS_CEPHALIC"
owner_id = "crew-1"
# Real-time demo: first completed minute warns; the second is critical.
onset_s = 10
warning_at_s = 45
escalate_to_critical = true
critical_start_s = 60
critical_at_s = 90
baseline_strain_pct = 0.65
warning_strain_pct = 1.55
critical_strain_pct = 2.05
gauge_factor = 15.5
affected_rmssd_ms = 36
baseline_icp_indicator_mmhg = 10.0
warning_icp_indicator_mmhg = 16.2
critical_icp_indicator_mmhg = 19.0
affected_logmar = 0.20
eye_screen_times_s = [60, 120]
