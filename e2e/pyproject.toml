[project]
name = "hydrograph-e2e"
version = "0.1.0"
description = "End-to-end tests: simulator -> backend -> frontend in a real browser"
requires-python = ">=3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=9.0", "pytest-playwright>=0.7", "httpx>=0.28", "ruff>=0.14"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# raised inside pytest-playwright's own base_url fixture, not in these tests
filterwarnings = ["ignore::pytest.PytestRemovedIn10Warning"]

[tool.ruff]
line-length = 100
